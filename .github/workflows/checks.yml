name: BeatOS checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install optional audio converter for export tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Python regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Browser logic regression tests
        run: |
          node tests/test_library_ui.cjs
          node tests/test_pad_audio.cjs
          node tests/test_creator_identity.cjs
          node tests/test_po33_backups.cjs
          node tests/test_i18n.cjs
      - name: Build clean installer
        run: python build_release.py "${{ runner.temp }}/BeatOS.zip"
      - name: Upload bilingual source build (not the stable release)
        uses: actions/upload-artifact@v4
        with:
          name: BeatOS-main-py${{ matrix.python }}
          path: ${{ runner.temp }}/BeatOS.zip
          if-no-files-found: error

  browser-locale:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Test actual ES/EN browser interactions
        run: python -B tests/smoke_browser_i18n.py
  windows-release-install:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Download and identify the stable installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/Astro1Deep/mpc-sample-database/releases/latest' -Headers @{'Accept'='application/vnd.github+json'; 'User-Agent'='BeatOS-install-check'; 'Authorization'="Bearer $env:GH_TOKEN"}
          $assets = @($release.assets | Where-Object { $_.name -like 'BeatOS-*.zip' })
          if ($assets.Count -ne 1) { throw 'Expected one stable BeatOS installer' }
          $digest = $assets[0].digest -replace '^sha256:', ''
          if ($digest -notmatch '^[a-f0-9]{64}$') { throw 'Missing SHA-256 digest' }
          Invoke-WebRequest $assets[0].browser_download_url -OutFile "$env:RUNNER_TEMP\BeatOS.zip"
          @{tag=$release.tag_name; sha256=$digest} | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\release-meta.json" -Encoding utf8
          Write-Output "Testing stable release $($release.tag_name)"
          $hostInfo = Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          Write-Output ('BEATOS_WINDOWS_HOST=' + ($hostInfo | ConvertTo-Json -Compress))
      - name: Install, index, stream and export on native Windows
        shell: pwsh
        run: |
          $releaseInfo = Get-Content "$env:RUNNER_TEMP\release-meta.json" | ConvertFrom-Json
          python -B tests/smoke_release_install.py --archive "$env:RUNNER_TEMP\BeatOS.zip" --sha256 $releaseInfo.sha256 --require-windows --report "$env:RUNNER_TEMP\windows-install-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP\windows-install-report.json" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Verify the current source installer on Windows
        shell: pwsh
        run: |
          python -B build_release.py "$env:RUNNER_TEMP\BeatOS-source.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceDigest = (Get-FileHash "$env:RUNNER_TEMP\BeatOS-source.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          python -B tests/smoke_release_install.py --archive "$env:RUNNER_TEMP\BeatOS-source.zip" --sha256 $sourceDigest --require-windows --report "$env:RUNNER_TEMP\windows-source-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP\windows-source-report.json" | Add-Content $env:GITHUB_STEP_SUMMARY

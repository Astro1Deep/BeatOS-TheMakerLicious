<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <radialGradient id="mpc-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#16152b"/>
      <stop offset="45%" stop-color="#0c0b16"/>
      <stop offset="100%" stop-color="#040408"/>
    </radialGradient>
    <radialGradient id="pad-glow" cx="20%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mpc-cyan-glow" cx="80%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mpc-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#ffdd00"/>
    </linearGradient>
    <filter id="mpc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#mpc-bg)"/>
  <rect width="1200" height="420" fill="url(#pad-glow)"/>
  <rect width="1200" height="420" fill="url(#mpc-cyan-glow)"/>

  <!-- Left: Stylized 4x4 MPC RGB Pads Array -->
  <g transform="translate(85, 80)">
    <!-- 4x4 Grid of illuminated MPC Pads -->
    <g fill="#1a1829" stroke="#ff0055" stroke-width="1.5" stroke-opacity="0.7">
      <!-- Row 1 -->
      <rect x="0" y="0" width="55" height="55" rx="8" fill="#2d1222" stroke="#ff0055" stroke-width="2" filter="url(#mpc-glow)"/>
      <rect x="65" y="0" width="55" height="55" rx="8"/>
      <rect x="130" y="0" width="55" height="55" rx="8"/>
      <rect x="195" y="0" width="55" height="55" rx="8" fill="#142634" stroke="#00f0ff" stroke-width="1.8"/>
      <!-- Row 2 -->
      <rect x="0" y="65" width="55" height="55" rx="8"/>
      <rect x="65" y="65" width="55" height="55" rx="8" fill="#2b2012" stroke="#ffaa00" stroke-width="1.8"/>
      <rect x="130" y="65" width="55" height="55" rx="8"/>
      <rect x="195" y="65" width="55" height="55" rx="8"/>
      <!-- Row 3 -->
      <rect x="0" y="130" width="55" height="55" rx="8"/>
      <rect x="65" y="130" width="55" height="55" rx="8"/>
      <rect x="130" y="130" width="55" height="55" rx="8" fill="#2d1222" stroke="#ff0055" stroke-width="1.8"/>
      <rect x="195" y="130" width="55" height="55" rx="8"/>
      <!-- Row 4 -->
      <rect x="0" y="195" width="55" height="55" rx="8" fill="#142634" stroke="#00f0ff" stroke-width="1.8"/>
      <rect x="65" y="195" width="55" height="55" rx="8"/>
      <rect x="130" y="195" width="55" height="55" rx="8"/>
      <rect x="195" y="195" width="55" height="55" rx="8" fill="#2b2012" stroke="#ffaa00" stroke-width="1.8"/>
    </g>

    <!-- Center Icon in Pad 1: Astro1Deep Eye Mini -->
    <path d="M12 28 Q27 15 42 28 Q27 41 12 28 Z" fill="#ffffff" filter="url(#mpc-glow)"/>
    <circle cx="27" cy="28" r="3.5" fill="#ff0055"/>
  </g>

  <!-- Right Typography Section -->
  <g transform="translate(400, 85)">
    <!-- Pill Badge -->
    <g transform="translate(0, 20)">
      <rect x="0" y="-16" width="135" height="24" rx="12" fill="#ffaa00" fill-opacity="0.18" stroke="#ffaa00" stroke-width="1"/>
      <text x="12" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="2" fill="#ffaa00">WAXSPACESHIP</text>
      <text x="148" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#64748b">HARDWARE SAMPLER CORE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1" fill="#ffffff">
      MPC Sample <tspan fill="url(#mpc-accent)">Database</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      87,411 Curated Samples in SQLite · Akai MPC &amp; Roland SP-404MK2 Ecosystem
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 160)">
      <g transform="translate(0, 0)">
        <rect width="145" height="28" rx="6" fill="#0f172a" stroke="#ff0055" stroke-width="1.2"/>
        <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ff0055">🎛️ 87,411 Samples</text>
      </g>
      <g transform="translate(157, 0)">
        <rect width="135" height="28" rx="6" fill="#0f172a" stroke="#00f0ff" stroke-width="1.2"/>
        <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00f0ff">⚡ SQLite FTS</text>
      </g>
      <g transform="translate(304, 0)">
        <rect width="165" height="28" rx="6" fill="#0f172a" stroke="#ffaa00" stroke-width="1.2"/>
        <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffaa00">🎵 HTML5 Web Player</text>
      </g>
      <g transform="translate(481, 0)">
        <rect width="180" height="28" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
        <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c084fc">💾 MicroSD / Volumes</text>
      </g>
    </g>

    <!-- Bottom Info -->
    <g transform="translate(0, 225)" opacity="0.85">
      <circle cx="6" cy="-4" r="3" fill="#10b981"/>
      <text x="18" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">
        Diseñado por Astro1Deep · Sello WaxSpaceship · Integración Nativa con Cerebro OS
      </text>
    </g>
  </g>

  <!-- Accent Borders -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#mpc-accent)" stroke-width="3"/>
  <line x1="0" y1="418" x2="1200" y2="418" stroke="url(#mpc-accent)" stroke-width="2" opacity="0.6"/>
</svg>
